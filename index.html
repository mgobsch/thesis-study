<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Office Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1C2733; --muted:#5B6877; --line:#D3DAE2;
  --accent:#2F5D8A; --accent-ink:#FFFFFF;
  --l-green:#2E9E5B; --l-orange:#E8871E; --l-blue:#2F7FD8; --l-off:#8A94A0;
  --wall:#E3E8EE; --wall2:#D2DAE3; --floor:#C4CCD6; --wood:#A5835F; --wood2:#7E6146; --room:#8E9BA8; --screen:#3A4756;
  --note:#FFF4BF; --note-line:#E9D98A; --note-ink:#3B3413;
  --ok:#2E7D4F; --err:#B3261E; --you:#F2C94C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#161C23; --panel:#1F2730; --ink:#E8EDF2; --muted:#9AA7B4; --line:#34404C;
  --accent:#7FB0E0; --accent-ink:#10202F; --wall:#2A333D; --wall2:#323D49; --floor:#222A33; --wood:#8A6C4E; --wood2:#6A523B; --room:#56626F; --screen:#11161C;
  --note:#3A3521; --note-line:#5A5230; --note-ink:#F3EBC4; --ok:#6FCF97; --err:#F2B8B5; }}
:root[data-theme="dark"]{
  --bg:#161C23; --panel:#1F2730; --ink:#E8EDF2; --muted:#9AA7B4; --line:#34404C;
  --accent:#7FB0E0; --accent-ink:#10202F; --wall:#2A333D; --wall2:#323D49; --floor:#222A33; --wood:#8A6C4E; --wood2:#6A523B; --room:#56626F; --screen:#11161C;
  --note:#3A3521; --note-line:#5A5230; --note-ink:#F3EBC4; --ok:#6FCF97; --err:#F2B8B5; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--l-green);box-shadow:0 0 10px var(--l-green)}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:5px 10px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:780px;margin:0 auto;padding:26px 18px 100px}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.45rem;line-height:1.25;margin:.2em 0 .6em}
h3{font-size:1.1rem;margin:1.2em 0 .4em}
p{margin:.5em 0 .9em;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack>*+*{margin-top:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:15px}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;align-items:center}
.nav .hint{margin-right:auto;color:var(--err);font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)}
label.opt+label.opt{margin-top:8px}
label.opt input{margin-top:5px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:700;margin-bottom:8px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;align-items:center}
.controls .lbl{font-weight:700;margin-right:8px}
/* scene */
.scene{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.scene text{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--ink)}
[data-hot]{cursor:pointer;outline:none}
[data-hot] .ring{fill:none;stroke:var(--accent);stroke-width:4;opacity:.9}
[data-hot].done .ring{stroke:var(--ok)}
[data-hot]:not(.done) .ring{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
[data-hot]:focus-visible .ring{stroke-width:7}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){[data-hot] .ring{animation:none!important}.prog>i{transition:none}}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 12px;font-size:15px}
.swatch{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle}
/* rule (top to bottom) */
.rulebox{display:flex;flex-direction:column}
.rulebox .rname{font-weight:700;margin-bottom:6px}
.rstep{display:flex;flex-direction:column}
.rstep .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rarrow{color:var(--muted);line-height:1;margin:3px 0 3px 4px;font-size:18px}
.rrow{display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule{border-left:6px solid var(--c)}
.person{display:flex;gap:14px;align-items:flex-start}
.person svg{width:72px;height:72px;flex:none}
.story{font-size:1.1rem}
/* notes (cheat sheet) */
.notes{background:var(--note);color:var(--note-ink);border:1px solid var(--note-line);border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.14);padding:16px 16px 20px}
.notes h3{margin:0 0 8px;font-size:1.05rem}
.notes .pin{width:14px;height:14px;border-radius:50%;background:var(--err);margin:-6px auto 8px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.notes .sec{border-top:1px dashed var(--note-line);padding-top:10px;margin-top:10px}
.notes .rstep .k,.notes .rarrow{color:inherit;opacity:.7}
.notes .nrule{padding:8px 0;border-bottom:1px dashed var(--note-line)}
.notes .nrule:last-child{border-bottom:0}
.notes .own{font-size:14px;margin-top:4px}
.notes-head{display:flex;justify-content:space-between;align-items:center}
.notes-close{display:none}
#notes{display:none}
body.notes-on #notes{display:block}
@media (min-width:1100px){
  body.notes-on{padding-right:350px}
  body.notes-on #notes{position:fixed;right:18px;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:18px;width:320px;overflow:auto;z-index:10}
  .notes-tab{display:none!important}
}
@media (max-width:1099px){
  body.notes-on #notes{position:fixed;left:8px;right:8px;bottom:0;max-height:78vh;overflow:auto;z-index:30;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0}
  body.notes-on #notes.open{transform:none}
  .notes-close{display:inline-block}
  .notes-tab{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--note);color:var(--note-ink);border:1px solid var(--note-line);border-radius:22px;padding:10px 20px;font:inherit;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer}
}
@media (prefers-reduced-motion:reduce){#notes{transition:none!important}}
.notes-tab{display:none}
body.notes-on .notes-tab{display:block}
.flash{animation:flash 1s ease 2}
.notes-hint{position:fixed;z-index:40;background:var(--panel);color:var(--ink);border:3px solid #D92D20;border-radius:10px;padding:12px 14px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notes-hint p{margin:0 0 8px;font-size:15px}
.hint-arrow{position:absolute;width:0;height:0;border:12px solid transparent}
body.hinting #notes{outline:4px solid #D92D20;outline-offset:4px;animation:ring 1.2s ease-in-out infinite}
body.hinting .notes-tab{outline:4px solid #D92D20;outline-offset:3px;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{outline-color:rgba(217,45,32,.25);outline-offset:9px}}
@media (min-width:1100px){.notes-hint{right:360px;top:calc(env(safe-area-inset-top,0px) + 110px)}
  .hint-arrow{right:-27px;top:18px;border-left-color:#D92D20}}
@media (max-width:1099px){.notes-hint{right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .hint-arrow{bottom:-27px;right:30px;border-top-color:#D92D20}}
@media (prefers-reduced-motion:reduce){body.hinting #notes,body.hinting .notes-tab{animation:none}}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--accent)}}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px}
.msg.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:13px;font-weight:700;opacity:.75;display:block}
/* ranking (tiles into numbered places) */
.rank-area{margin-top:12px}
.zone-lbl{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:10px;background:var(--bg)}
.pool.empty::after{content:attr(data-empty);color:var(--muted);font-size:14px;align-self:center;padding:0 6px}
.slots{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:5px 8px;background:var(--panel)}
.slot .no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.slot .cap{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.slot.filled{border-style:solid}
.tile{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:7px 12px;font:inherit;font-size:15px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.tile.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:grabbing}
.tile.src{opacity:.35}
.drop-hi{border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.locked .tile{cursor:default}
.yours{display:inline-block;font-size:12px;font-weight:700;background:var(--you);color:#3B3413;border-radius:4px;padding:0 6px}
.lockmsg{margin-top:10px;font-weight:700;color:var(--ok)}
/* rating */
.answer{border-top:6px solid var(--accent)}
.answer.b{border-top-color:var(--muted)}
.answer blockquote{margin:0 0 12px;padding:0;font-size:1.05rem}
.lik{margin:10px 0}
.lik .q{font-size:15px;margin-bottom:4px}
.pills{display:flex;gap:6px}
.pills label{flex:1;min-width:40px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 0;cursor:pointer;font-size:15px;background:var(--panel);position:relative}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pills label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.feedback{margin-top:8px;font-size:15px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--err)}
details.debug{margin-top:30px;font-size:13px}
details.debug pre{white-space:pre-wrap;overflow-x:auto;max-height:300px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:8px}
@media (max-width:560px){h1{font-size:1.6rem}.brand span:last-child{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span id="brand"></span></div>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progbar"><i id="prog"></i></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button>
  </div>
</div></header>
<main id="app" aria-live="polite"></main>
<aside id="notes" class="notes" aria-label="Office notes"></aside>
<button type="button" class="notes-tab" id="notes-tab"></button>
<div id="notes-hint" class="notes-hint" role="status" hidden></div>

<script>
/* =====================================================================
   1) STUDY SETTINGS — edit freely
   ===================================================================== */
const SETTINGS = {
  TEST_MODE: true,          // true = shows the collected data on the end screen (set false for the real study)
  SURVEY_RETURN_URL: "",    // optional link at the end ("" = no button)
  // Web-app URL of the Google Apps Script (see ANLEITUNG_Google_Tabelle.md). "" = do not send.
  SAVE_URL: "",
  // Extra context in the office notes:
  //   "basic" = owners only (current choice)
  //   "all"   = owners + how often each rule was fired / explained in the past 90 days
  //   "split" = each participant is randomly assigned "all" or "basic"
  CONTEXT_MODE: "basic",
};

/* 2) RULE STATISTICS (past 90 days, from system_data_summary.json) — only shown when CONTEXT_MODE is "all" */
const STATS = {
  notoccupied:{ran:65, explained:{Alice:3, Bob:0}},
  occupied:   {ran:66, explained:{Alice:1, Bob:0}},
  rain:       {ran:4,  explained:{Alice:4, Bob:8}},
  sunny:      {ran:86, explained:{Alice:2, Bob:2}},
  danger:     {ran:1,  explained:{Alice:0, Bob:0}},
  closing:    {ran:90, explained:{Alice:0, Bob:0}},
};

/* =====================================================================
   3) RULES — every rule that changes the status light
      when = "Starts when", only = "Only if" (null = none), c = resulting light colour
   ===================================================================== */
const LIGHT = { green:"var(--l-green)", orange:"var(--l-orange)", blue:"var(--l-blue)", off:"var(--l-off)" };
const RULES = {
  notoccupied:{c:"green", owner:"Alice",
    en:{name:"Meeting Room Not Occupied", when:"the meeting-room door opens", only:"nobody is moving inside the meeting room"},
    de:{name:"Besprechungsraum nicht belegt", when:"die Tür des Besprechungsraums aufgeht", only:"sich niemand im Besprechungsraum bewegt"}},
  occupied:{c:"orange", owner:"Alice",
    en:{name:"Meeting Room Occupied", when:"the meeting-room door closes", only:"someone is moving inside the meeting room"},
    de:{name:"Besprechungsraum belegt", when:"die Tür des Besprechungsraums zugeht", only:"sich jemand im Besprechungsraum bewegt"}},
  rain:{c:"blue", owner:"Bob",
    en:{name:"Rain at Lunch", when:"the forecast says rain", only:"it is lunchtime (11:00–13:00)"},
    de:{name:"Regen zur Mittagszeit", when:"die Vorhersage Regen meldet", only:"es Mittagszeit ist (11:00–13:00)"}},
  sunny:{c:"orange", owner:"Bob",
    en:{name:"Sunny at Lunch", when:"the forecast says sun", only:"it is lunchtime (11:00–13:00)"},
    de:{name:"Sonne zur Mittagszeit", when:"die Vorhersage Sonne meldet", only:"es Mittagszeit ist (11:00–13:00)"}},
  danger:{c:"orange", owner:"Alice", extra:{en:" and the fan runs on high", de:" und der Lüfter läuft auf hoch"},
    en:{name:"Danger", when:"smoke, CO₂ or a fire alarm is detected", only:"it is between 08:00 and 18:00"},
    de:{name:"Gefahr", when:"Rauch, CO₂ oder ein Feueralarm erkannt wird", only:"es zwischen 08:00 und 18:00 ist"}},
  closing:{c:"off", owner:"Alice",
    en:{name:"Closing Time", when:"it is 18:00", only:null},
    de:{name:"Feierabend", when:"es 18:00 ist", only:null}},
};

/* =====================================================================
   4) SCENARIOS — story (what the persona knows), facts, candidate foils, explanations
   ===================================================================== */
const SCENARIOS = {
  TC1: {
    person:"Alice", colleague:true, group:true, time:"12:08", weather:"rain", door:"closed", full:true, light:"orange",
    story:{en:"You are Alice. It is 12:08. A meeting has just ended in the meeting room. You see a group of colleagues coming out of the room and standing together in the hallway. The meeting-room door is closed. You look at the status light above the door.",
           de:"Du bist Alice. Es ist 12:08 Uhr. Im Besprechungsraum ist gerade ein Meeting zu Ende gegangen. Du siehst eine Gruppe von Kolleginnen und Kollegen aus dem Raum kommen und im Flur zusammenstehen. Die Tür des Besprechungsraums ist zu. Du schaust auf das Statuslicht über der Tür."},
    ask:{en:"Why is the status light orange?", de:"Warum ist das Statuslicht orange?"},
    foils:["notoccupied","rain"],
    explanations:{
      C0:{en:"The Status Light is orange and not green because Occupancy of meeting room is Detected, Contact Sensor Meeting Room Opening is off.",
          de:"Das Statuslicht ist orange und nicht grün, weil Belegung des Besprechungsraums ist Erkannt, Kontaktsensor Öffnung Besprechungsraum ist aus."},
      WIN:{en:"Because the door sensor reported the meeting‑room door as closed and the motion sensor detected presence, the “Meeting Room Occupied” rule’s conditions were satisfied, so its action set the status light to orange. The “Meeting room not occupied” rule requires the motion sensor to be clear, which wasn’t the case, so it didn’t fire and the light stayed orange instead of green.",
           de:"Weil der Türsensor die Tür des Besprechungsraums als geschlossen gemeldet hat und der Bewegungsmelder Anwesenheit erkannt hat, waren die Bedingungen der Regel „Besprechungsraum belegt“ erfüllt, sodass ihre Aktion das Statuslicht auf Orange gesetzt hat. Die Regel „Besprechungsraum nicht belegt“ setzt voraus, dass der Bewegungsmelder nichts erkennt, was nicht der Fall war; deshalb hat sie nicht ausgelöst und das Licht blieb orange statt grün."}
    },
    mcq:{ q:{en:"According to the explanations, why is the status light orange?", de:"Warum ist das Statuslicht laut den Erklärungen orange?"}, correct:0, opts:[
      {en:"The door is closed and movement was detected in the meeting room.", de:"Die Tür ist zu und im Besprechungsraum wurde Bewegung erkannt."},
      {en:"It is lunchtime and the forecast says rain.", de:"Es ist Mittagszeit und die Vorhersage meldet Regen."},
      {en:"It is lunchtime and the forecast says sun.", de:"Es ist Mittagszeit und die Vorhersage meldet Sonne."},
      {en:"Smoke was detected and it is between 08:00 and 18:00.", de:"Es wurde Rauch erkannt und es ist zwischen 8 und 18 Uhr."}]}
  },
  TC2: {
    person:"Bob", colleague:true, group:true, time:"12:10", weather:"rain", door:"closed", full:true, light:"orange",
    story:{en:"You are Bob. You created a rule that turns the status light blue when rain is forecast at lunchtime, to remind everyone to take a coat or an umbrella. It is 12:10 now, and it is raining outside. In front of the meeting room, a group of colleagues is standing and talking. You walk past the meeting room and look at the status light above the door.",
           de:"Du bist Bob. Du hast eine Regel erstellt, die das Statuslicht blau schaltet, wenn zur Mittagszeit Regen vorhergesagt ist – damit alle an Jacke oder Regenschirm denken. Jetzt ist es 12:10 Uhr und draußen regnet es. Vor dem Besprechungsraum steht eine Gruppe von Kolleginnen und Kollegen und unterhält sich. Du gehst am Besprechungsraum vorbei und schaust auf das Statuslicht über der Tür."},
    ask:{en:"Why is the status light orange?", de:"Warum ist das Statuslicht orange?"},
    foils:["notoccupied","rain"],
    explanations:{
      C0:{en:"The Status Light is orange and not blue because Occupancy of meeting room is Detected, Contact Sensor Meeting Room Opening is off.",
          de:"Das Statuslicht ist orange und nicht blau, weil Belegung des Besprechungsraums ist Erkannt, Kontaktsensor Öffnung Besprechungsraum ist aus."},
      WIN:{en:"Because the door was closed and motion was detected, the system treated the meeting room as occupied and ran the rule that sets the status light to orange. Even though it was rainy at lunch, the occupancy rule takes priority, so the light stayed orange instead of turning blue.",
           de:"Weil die Tür geschlossen war und Bewegung erkannt wurde, hat das System den Besprechungsraum als belegt behandelt und die Regel ausgeführt, die das Statuslicht auf Orange setzt. Obwohl es mittags regnerisch war, hat die Belegungsregel Vorrang, deshalb blieb das Licht orange, statt blau zu werden."}

/* ---------- rule rendering (top to bottom) ---------- */
function ruleBlock(id, {name=true, extraHTML=""}={}){
  const r = RULES[id], L = r[lang], tt = t();
  const extra = r.extra ? r.extra[lang] : "";
  const result = r.c==="off" ? tt.then_off(extra) : tt.then_tpl(tt.st[r.c], extra);
  return `<div class="rulebox">${name?`<div class="rname">${esc(L.name)}${extraHTML}</div>`:""}
    <div class="rstep"><span class="k">${tt.k_when}</span><span>${esc(L.when)}</span></div>
    ${L.only?`<div class="rarrow" aria-hidden="true">↓</div><div class="rstep"><span class="k">${tt.k_only}</span><span>${esc(L.only)}</span></div>`:""}
    <div class="rarrow" aria-hidden="true">↓</div>
    <div class="rstep"><span class="k">${tt.k_then}</span><span class="rrow"><span class="swatch" style="background:${LIGHT[r.c]}"></span>${esc(result)}</span></div></div>`;
}

/* ---------- ranking interactions ---------- */
const ui = {sel:null, drag:null};
function place(tc, id, target, how){       // target: slot index (number) or "pool"
  const d = DATA.rank[tc]; if (d.locked) return;
  const fromSlot = d.slots.indexOf(id), fromPool = d.pool.indexOf(id);
  if (target==="pool"){ if (fromPool>=0) return; d.slots[fromSlot] = null; d.pool.push(id); }
  else {
    if (fromSlot===target) return;
    const occupant = d.slots[target];
    if (fromSlot>=0){ d.slots[fromSlot] = occupant; }                    // swap between places
    else { d.pool.splice(fromPool,1); if (occupant) d.pool.push(occupant); } // occupant goes back to the pool
    d.slots[target] = id;
  }
  d.moves++; d.log.push({how, rule:id, to:target, slots:[...d.slots], at_ms:Date.now()-enteredAt});
  ui.sel = null; render();
}
function dropTargetAt(x,y){
  const el = document.elementFromPoint(x,y); if (!el) return null;
  const slot = el.closest("[data-slot]"); if (slot) return Number(slot.dataset.slot);
  if (el.closest("[data-pool]")) return "pool";
  return null;
}
document.addEventListener("pointerdown", ev=>{

  const [kind,tc] = SCREENS[idx].split(":"); if (kind!=="rank" || DATA.rank[tc].locked) return;
  if (ev.button!==undefined && ev.button!==0) return;
  ui.drag = {id:tl.dataset.tile, tc, x0:ev.clientX, y0:ev.clientY, el:tl, ghost:null, over:null};
});
document.addEventListener("pointermove", ev=>{
  const g = ui.drag; if (!g) return;
  if (!g.ghost){
    if (Math.hypot(ev.clientX-g.x0, ev.clientY-g.y0) < 6) return;
    g.ghost = g.el.cloneNode(true); g.ghost.classList.add("ghost"); g.ghost.classList.remove("sel"); document.body.appendChild(g.ghost); g.el.classList.add("src");
  }
  ev.preventDefault();
  if (ev.clientY > innerHeight-70) scrollBy(0,14); else if (ev.clientY < 90) scrollBy(0,-14);   // auto-scroll near the edges
  g.ghost.style.left = (ev.clientX - g.ghost.offsetWidth/2)+"px"; g.ghost.style.top = (ev.clientY - g.ghost.offsetHeight/2)+"px";
  const tgt = dropTargetAt(ev.clientX, ev.clientY);
  document.querySelectorAll(".drop-hi").forEach(e=>e.classList.remove("drop-hi"));
  if (tgt!==null){ const el = tgt==="pool" ? document.querySelector("[data-pool]") : document.querySelector(`[data-slot="${tgt}"]`); el && el.classList.add("drop-hi"); }
}, {passive:false});
function endDrag(ev){
  const g = ui.drag; if (!g) return; ui.drag = null;
  if (!g.ghost) return;                       // no movement: treat as a click (handled by click)
  g.ghost.remove(); g.el.classList.remove("src"); ui.justDragged = true; setTimeout(()=>ui.justDragged=false, 0);
  const tgt = dropTargetAt(ev.clientX, ev.clientY);
  if (tgt!==null) place(g.tc, g.id, tgt, "drag"); else render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", e=>{ const g = ui.drag; if (g&&g.ghost){ g.ghost.remove(); g.el.classList.remove("src"); } ui.drag = null; });

/* ---------- render + navigation ---------- */
function render(){
  document.documentElement.lang = lang;
  document.getElementById("brand").textContent = t().brand;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  const pct = Math.round(idx/(SCREENS.length-1)*100);
  document.getElementById("prog").style.width = pct+"%"; document.getElementById("progbar").setAttribute("aria-valuenow",pct);
  const sc = SCREENS[idx], [kind,tc] = sc.split(":");
  app.innerHTML = kind==="story" ? storyScreen(tc) : kind==="rank" ? rankScreen(tc) : kind==="rate" ? rateScreen(tc) : R[sc]();
  renderNotes();
  if (sc==="end") save();
}
function go(delta){
  const sc = SCREENS[idx];
  DATA.timing[sc] = (DATA.timing[sc]||0) + (Date.now()-enteredAt);
  idx = Math.max(0, Math.min(SCREENS.length-1, idx+delta)); enteredAt = Date.now(); openDev = null; ui.sel = null;
  document.getElementById("notes").classList.remove("open");
  render(); window.scrollTo({top:0});
  persist();
  if (idx>0 && idx<SCREENS.length-1) saveProgress();
  if (sc.startsWith("rate:") && delta>0) sendToSheet(false);   // partial row after each situation
}
function validate(){
  const sc = SCREENS[idx], [kind,tc] = sc.split(":");
  if (sc==="about") return !!(DATA.about.age && DATA.about.tech && DATA.about.techbg);
  if (sc==="final") return !!DATA.final.attention;
  if (kind==="rank") return DATA.rank[tc].locked;
  if (kind==="rate") return rateComplete(tc);
  return true;
}

app.addEventListener("click", e=>{
  const hot = e.target.closest("[data-hot]");
  if (hot){ const k = hot.dataset.hot; openDev = k; if(!DATA.tutorial.seen.includes(k)) DATA.tutorial.seen.push(k); render(); return; }
  const sc = SCREENS[idx], [kind,tc] = sc.split(":");
  if (kind==="rank" && !ui.justDragged && DATA.rank[tc] && !DATA.rank[tc].locked){
    const tl = e.target.closest(".tile[data-tile]");
    if (tl){ const id = tl.dataset.tile;
      if (ui.sel && ui.sel!==id){ const sl = tl.closest("[data-slot]"); if (sl){ place(tc, ui.sel, Number(sl.dataset.slot), "tap"); return; } }
      ui.sel = ui.sel===id ? null : id; render(); return; }
    if (ui.sel){ const sl = e.target.closest("[data-slot]"); if (sl){ place(tc, ui.sel, Number(sl.dataset.slot), "tap"); return; }
      if (e.target.closest("[data-pool]")){ place(tc, ui.sel, "pool", "tap"); return; } }
  }
  const el = e.target.closest("button"); if(!el) return;
  if (el.id==="next"){ if(!validate()){ document.getElementById("hint").textContent = kind==="rank" ? t().lock_first : t().missing; return; }
    if (sc==="start") DATA.consent_at = new Date().toISOString(); return go(1); }
  if (el.id==="back") return go(-1);
  if (el.dataset.notes) return openNotes(el.dataset.notes);
  if (el.dataset.demo){ if (el.dataset.demo==="door") demo.door = el.dataset.v; else demo.full = el.dataset.v==="full";
    const k = demoKey(); if (!DATA.tutorial.door_demo.includes(k)) DATA.tutorial.door_demo.push(k); render(); return; }
  if (el.id==="ask"){ DATA.rank[tc].asked = true; DATA.rank[tc].asked_after_ms = Date.now()-enteredAt; render(); return; }
  if (el.id==="lock"){ const d = DATA.rank[tc]; if (d.pool.length) return; d.locked = true; d.locked_order = [...d.slots]; d.locked_after_ms = Date.now()-enteredAt; d.locked_at = new Date().toISOString(); render(); return; }
});
app.addEventListener("keydown", e=>{
  const el = e.target.closest("[data-hot]");
  if (el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); el.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});
app.addEventListener("change", e=>{
  const el = e.target, sc = SCREENS[idx], [kind,tc] = sc.split(":");
  if (el.id==="consent"){ DATA.consent = el.checked; document.getElementById("next").disabled = !el.checked; return; }
  if (sc==="about"){ DATA.about[el.name] = el.name==="tech" ? Number(el.value) : el.value; return; }
  if (sc==="quiz" && el.name.startsWith("quiz")){ const i = Number(el.name.slice(4));
    DATA.quiz["q"+(i+1)] = {answer:Number(el.value), correct:Number(el.value)===T.en.quiz[i].c}; render(); return; }
  if (kind==="rate"){ const d = DATA.rate[tc];
    if (el.name==="pref") d.pref = el.value;
    else if (el.name==="mcq"){ d.mcq = Number(el.value); d.mcq_correct = d.mcq===SCENARIOS[tc].mcq.correct; }
    else if (el.name.startsWith("lk_")){ const [,side,key] = el.name.split("_"); d.likert[side][key] = Number(el.value); }
    document.getElementById("hint").textContent = ""; return; }
  if (sc==="final" && el.name==="attn"){ DATA.final.attention = el.value; DATA.final.attention_passed = el.value==="blue"; }
});
app.addEventListener("input", e=>{
  if (e.target.id==="fb1") DATA.final.unclear = e.target.value;
  if (e.target.id==="fb2") DATA.final.improve = e.target.value;
});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.lang; (DATA.lang_switches ||= []).push({to:lang, screen:SCREENS[idx]}); render(); persist();
}));
document.getElementById("notes-tab").addEventListener("click",()=>{ openNotes("tab"); dismissHint(); });
function dismissHint(){ if (DATA.notes_hint_done) return; DATA.notes_hint_done = true; DATA.notes_hint_at = SCREENS[idx]; renderNotes(); }
document.getElementById("notes-hint").addEventListener("click", e=>{ if (e.target.id==="hint-ok") dismissHint(); });
document.getElementById("notes").addEventListener("click", e=>{ if (e.target.id==="notes-close") document.getElementById("notes").classList.remove("open"); });

/* ---------- saving ---------- */
// Flat summary for the spreadsheet: A/B are mapped back to C0 (SmartEx baseline) and WIN (GPT-OSS + P1 + C2).
function summary(){
  const o = {pid, finished: !!DATA.finished_at, started: DATA.started, finished_at: DATA.finished_at||"",
    lang_start: DATA.lang_start, context_mode: DATA.context_mode, order: DATA.order.join(" "),
    age: DATA.about.age||"", smarthome_familiarity: DATA.about.tech||"", tech_background: DATA.about.techbg||"",
    quiz_correct: Object.values(DATA.quiz).filter(q=>q.correct).length,
    notes_opens: DATA.notes_opens.length, attention_passed: DATA.final.attention_passed ?? "",
    feedback_unclear: DATA.final.unclear||"", feedback_improve: DATA.final.improve||""};
  for (const tc of ["TC1","TC2","TC3"]){
    const r = DATA.rank[tc], q = DATA.rate[tc], ab = DATA.ab[tc];
    o[`${tc}_rank_locked`] = r.locked_order ? r.locked_order.join(" > ") : "";
    o[`${tc}_rank_first`] = r.locked_order ? r.locked_order[0] : "";
    o[`${tc}_rank_moves`] = r.moves;
    o[`${tc}_rank_initial_pool`] = r.initial.join(" ");
    o[`${tc}_A_is`] = ab.A;
    o[`${tc}_preferred`] = q && q.pref ? ab[q.pref] : "";
    for (const [k] of T.en.lik_items) for (const side of ["A","B"]) o[`${tc}_${ab[side]}_${k}`] = q ? (q.likert[side][k]||"") : "";
    o[`${tc}_mcq_correct`] = q && q.mcq!==null ? q.mcq_correct : "";
    o[`${tc}_time_rank_s`] = Math.round((DATA.timing["rank:"+tc]||0)/1000);
    o[`${tc}_time_rate_s`] = Math.round((DATA.timing["rate:"+tc]||0)/1000);
  }
  o.total_time_min = Math.round(Object.values(DATA.timing).reduce((a,b)=>a+b,0)/60000*10)/10;
  return o;
}
async function sendToSheet(finished){
  if (!SETTINGS.SAVE_URL) return false;
  const body = JSON.stringify({summary: summary(), raw: DATA});
  for (let attempt=0; attempt<3; attempt++){
    try{
      // text/plain + no-cors avoids a CORS preflight; Apps Script still receives the body
      await fetch(SETTINGS.SAVE_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
      DATA.sent_ok = (DATA.sent_ok||0)+1; persist(); return true;
    }catch(e){ await new Promise(r=>setTimeout(r, 1500*(attempt+1))); }
  }
  DATA.sent_failed = (DATA.sent_failed||0)+1; persist(); return false;
}
let dbRef = null;
(async()=>{ try{ const db = await window.claude?.use?.("db"); if (db) dbRef = db.collection("responses").doc(pid); }catch(e){} })();
async function saveProgress(){ if(!dbRef) return; try{ await dbRef.set({...DATA, finished:false, updated:new Date().toISOString()}); }catch(e){} }
async function save(){
  if (!DATA.finished_at) DATA.finished_at = new Date().toISOString();
  const el = () => document.getElementById("savestate");
  let ok = false;
  if (SETTINGS.SAVE_URL) ok = await sendToSheet(true);
  if (dbRef){ try{ await dbRef.set({...DATA, finished:true}); ok = true; }catch(e){} }
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  if (el()) el().innerHTML = ok ? esc(t().saved) : `${esc(t().notsaved)} <button type="button" class="btn small" id="retry">${t().retry}</button>`;
}
app.addEventListener("click", e=>{ if (e.target.id==="retry"){ e.target.disabled = true; save(); } });
render();
</script>
